<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Seed-42 suspicious components captured by review budget for random forest and GraphSAGE</title>
  <desc id="desc">At review budgets 0.5, 1, 2, 5, and 10 percent, random forest captured 117, 190, 262, 357, and 421 suspicious components; GraphSAGE captured 72, 127, 168, 238, and 326.</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="70" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Review-budget capture: RF vs GraphSAGE</text>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Matched seed-42 held-out components</text>
  <line x1="90" y1="430" x2="900" y2="430" stroke="#9ca3af"/>
  <line x1="90" y1="120" x2="90" y2="430" stroke="#9ca3af"/>
  <g stroke="#e5e7eb"><line x1="90" y1="361" x2="900" y2="361"/><line x1="90" y1="292" x2="900" y2="292"/><line x1="90" y1="223" x2="900" y2="223"/><line x1="90" y1="154" x2="900" y2="154"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#6b7280">
    <text x="46" y="434">0</text><text x="34" y="365">100</text><text x="34" y="296">200</text><text x="34" y="227">300</text><text x="34" y="158">400</text>
  </g>
  <polyline points="160,349 315,299 470,249 650,184 840,139" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="160,380 315,342 470,314 650,266 840,205" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#7c3aed"><circle cx="160" cy="349" r="6"/><circle cx="315" cy="299" r="6"/><circle cx="470" cy="249" r="6"/><circle cx="650" cy="184" r="6"/><circle cx="840" cy="139" r="6"/></g>
  <g fill="#64748b"><circle cx="160" cy="380" r="6"/><circle cx="315" cy="342" r="6"/><circle cx="470" cy="314" r="6"/><circle cx="650" cy="266" r="6"/><circle cx="840" cy="205" r="6"/></g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#374151" text-anchor="middle"><text x="160" y="458">0.5%</text><text x="315" y="458">1%</text><text x="470" y="458">2%</text><text x="650" y="458">5%</text><text x="840" y="458">10%</text></g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700"><rect x="620" y="92" width="18" height="4" fill="#7c3aed"/><text x="648" y="98" fill="#374151">Node-enriched RF</text><rect x="758" y="92" width="18" height="4" fill="#64748b"/><text x="786" y="98" fill="#374151">GraphSAGE</text></g>
  <text x="495" y="495" font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Review budget (share of held-out cases)</text>
</svg>
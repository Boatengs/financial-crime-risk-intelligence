<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Suspicious components captured by investigator review budget</title>
  <desc id="desc">Five-seed mean results for the preferred node-enriched random forest: 115 at 0.5 percent, 188.8 at 1 percent, 261.8 at 2 percent, 355.6 at 5 percent, and 424.6 at 10 percent.</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="70" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Investigator review budget → suspicious components captured</text>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Preferred node-enriched random forest · five-seed mean</text>
  <line x1="90" y1="430" x2="900" y2="430" stroke="#9ca3af" stroke-width="1"/>
  <line x1="90" y1="120" x2="90" y2="430" stroke="#9ca3af" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#6b7280">
    <text x="46" y="434">0</text><text x="34" y="365">100</text><text x="34" y="296">200</text><text x="34" y="227">300</text><text x="34" y="158">400</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="361" x2="900" y2="361"/><line x1="90" y1="292" x2="900" y2="292"/><line x1="90" y1="223" x2="900" y2="223"/><line x1="90" y1="154" x2="900" y2="154"/>
  </g>
  <polyline points="160,351 315,300 470,249 650,185 840,137" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#7c3aed">
    <circle cx="160" cy="351" r="7"/><circle cx="315" cy="300" r="7"/><circle cx="470" cy="249" r="7"/><circle cx="650" cy="185" r="7"/><circle cx="840" cy="137" r="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="160" y="333">115.0</text><text x="315" y="282">188.8</text><text x="470" y="231">261.8</text><text x="650" y="167">355.6</text><text x="840" y="119">424.6</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#374151" text-anchor="middle">
    <text x="160" y="458">0.5%</text><text x="315" y="458">1%</text><text x="470" y="458">2%</text><text x="650" y="458">5%</text><text x="840" y="458">10%</text>
  </g>
  <text x="495" y="495" font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Review budget (share of held-out cases)</text>
  <text x="18" y="280" transform="rotate(-90 18 280)" font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Suspicious components captured</text>
</svg>
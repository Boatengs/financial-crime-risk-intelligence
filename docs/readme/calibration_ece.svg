<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Calibration expected calibration error comparison</title>
  <desc id="desc">Held-out 60/20/20 calibration experiment: raw random forest ECE 0.008812, sigmoid 0.002716, isotonic 0.001389. Lower is better.</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="70" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">Calibration quality: expected calibration error</text>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Held-out 60/20/20 experiment · lower is better</text>
  <line x1="110" y1="425" x2="890" y2="425" stroke="#9ca3af"/>
  <line x1="110" y1="125" x2="110" y2="425" stroke="#9ca3af"/>
  <g stroke="#e5e7eb"><line x1="110" y1="365" x2="890" y2="365"/><line x1="110" y1="305" x2="890" y2="305"/><line x1="110" y1="245" x2="890" y2="245"/><line x1="110" y1="185" x2="890" y2="185"/><line x1="110" y1="125" x2="890" y2="125"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">
    <text x="98" y="429">0.000</text><text x="98" y="369">0.002</text><text x="98" y="309">0.004</text><text x="98" y="249">0.006</text><text x="98" y="189">0.008</text><text x="98" y="129">0.010</text>
  </g>
  <rect x="190" y="161" width="150" height="264" rx="8" fill="#7c3aed"/>
  <rect x="405" y="344" width="150" height="81" rx="8" fill="#2563eb"/>
  <rect x="620" y="383" width="150" height="42" rx="8" fill="#059669"/>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="265" y="146">0.00881</text><text x="480" y="329">0.00272</text><text x="695" y="368">0.00139</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#374151" text-anchor="middle">
    <text x="265" y="456">Raw RF</text><text x="480" y="456">Sigmoid</text><text x="695" y="456">Isotonic</text>
  </g>
  <text x="495" y="492" font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Sigmoid preserved ranking while reducing ECE by about 69%</text>
</svg>
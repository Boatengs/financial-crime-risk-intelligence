elliptic2:
  expected_files:
    - background_edges.csv
    - background_nodes.csv
    - connected_components.csv
    - edges.csv
    - nodes.csv
  published_scale:
    background_nodes: 49299864
    background_edges: 196215606
    labeled_subgraphs: 121810
    suspicious_subgraphs: 2763
    licit_subgraphs: 119047
    node_features: 43
    edge_features: 95
  verified_schema:
    background_edges:
      source: clId1
      target: clId2
    connected_components:
      label: ccLabel
      component_id_position: first_column
    nodes:
      cluster_id_position: first_column
      component_id_position: second_column
notes:
  - The five-file layout and positional mappings above are verified against the official MITIBMxGraph/Elliptic2 preprocessing code.
  - Raw feature names are anonymized/binned by the dataset provider.
  - Exact downloaded headers and inferred data types must still be captured in the schema manifest before full processing.
  - The paper reports 43 node features and 95 edge features; do not substitute counts from third-party implementations without verification.

elliptic2:
  expected_files:
    - background_edges.csv
    - background_nodes.csv
    - connected_components.csv
    - edges.csv
    - nodes.csv

  verified_scale:
    background_nodes: 49299864
    background_edges: 196215606
    labeled_components: 121810
    labeled_nodes: 444521
    labeled_edges: 367137
    node_features: 43
    edge_features: 95

  verified_schema:
    background_nodes:
      cluster_id: clId
      feature_prefix: "feat#"
      feature_count: 43
    background_edges:
      source: clId1
      target: clId2
      transaction_id: txId
      feature_prefix: "feat#"
      feature_count: 95
    connected_components:
      component_id: ccId
      label: ccLabel
    nodes:
      cluster_id: clId
      component_id: ccId
    edges:
      source: clId1
      target: clId2
      transaction_id: txId

  verified_release_labels:
    positive: suspicious
    negative: licit
    positive_components: 2763
    negative_components: 119047

  label_mapping:
    positive:
      - suspicious
      - illicit
      - "1"
      - "true"
    negative:
      - licit
      - non-suspicious
      - nonsuspicious
      - "0"
      - "false"

notes:
  - Row counts, exact headers, and actual ccLabel values above were verified against the locally downloaded Elliptic2 release on 2026-08-31.
  - The labeled files carry component membership and labels; the 43 node features and 95 edge features live in the background files.
  - Labeled-edge integrity profiling found zero missing source nodes, zero missing target nodes, and zero cross-component edges.
  - Production feature extraction should join the small labeled universe to the large background tables and aggregate only relevant rows.
  - Raw features are anonymized/binned by the dataset provider; no semantic meaning should be assigned to feat# columns without source documentation.
